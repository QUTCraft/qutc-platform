      summary: 分页查询当前组织的活动策划历史
      description: 需要 `ai:use`。结果按创建时间倒序，仅返回当前组织的方案摘要；运行终态会同步到方案状态。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 活动策划历史；每项包含当前登录评审人的评分状态，不暴露其他评审人的明细
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [AI]
      operationId: createAdminAIActivityPlan
      summary: 创建带引用的校园活动策划任务
      description: 需要 `ai:use` 与 `knowledge:read`。结构化活动需求与显式选择的当前组织知识会交给 activity-planner；接口只生成方案和建议操作，不创建项目或发布内容。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityPlanCreateRequest' }
      responses:
        '202':
          description: 活动策划任务已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/ai/activity-plans/evaluation-summary:
    get:
      tags: [AI]
      operationId: getAdminAIActivityPlanEvaluationSummary
      summary: 获取当前组织的活动方案人工质量汇总
      description: 需要 `ai:use`。按组织汇总五维人工评分、已评方案数和模型/Prompt 分组；不返回任何评语正文或其他组织数据。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
