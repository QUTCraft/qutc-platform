  /api/v1/admin/notifications/outbox/{notification_id}/retry:
    post:
      tags: [Admin]
      operationId: retryAdminNotification
      summary: 重新排队失败通知
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: notification_id
