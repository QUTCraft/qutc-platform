        - name: plan_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 36 }
      responses:
        '200':
          description: 当前用户的评分或 null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanEvaluationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [AI]
      operationId: putAdminAIActivityPlanEvaluation
      summary: 保存当前用户对活动方案的五维人工评分
      description: 需要 `ai:use`。同一用户对同一方案重复提交时覆盖原评分并记录审计；仅 ready 或 applied 方案可评分，且不会触发任何业务操作。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityPlanEvaluationRequest' }
      responses:
        '200':
          description: 评分已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanEvaluationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/ai/activity-plans/{plan_id}/approve:
    post:
      tags: [AI]
      operationId: approveAdminAIActivityPlan
      summary: 人工批准活动策划中的类型化建议操作
      description: |
        需要 `ai:use`、`project:manage` 与 `content:create`。只接受服务端定义的操作键；里程碑必须与创建项目同时批准。
        所有对象在一个事务中创建并逐项审计。项目保持非公开，公告固定创建为 draft，接口永不自动发布内容或执行外部命令。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityPlanApprovalRequest' }
      responses:
        '200':
          description: 所选建议操作已在事务中执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanApprovalResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/notifications/email/status:
    get:
      tags: [Admin]
      operationId: getAdminEmailAdapterStatus
      summary: 获取邀请邮件适配器状态
      description: 返回驱动、启用状态、发件人和传输安全模式；SMTP 主机、用户名、密码等服务端凭据不会返回。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前 API 实例的邮件适配器状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailAdapterStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/integrations:
    get:
      tags: [Admin]
      operationId: getAdminIntegrationSettings
      summary: 获取组织服务接入配置
      description: |
        返回门户公网地址、SMTP、S3/MinIO 与部署维护项。密码、Access Key 和 Secret Key 永不返回明文，
        仅返回是否已配置及尾号提示。组织尚未保存网页配置时返回当前部署默认值，并标记 source=deployment。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前组织的有效服务接入配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      operationId: updateAdminIntegrationSettings
      summary: 保存并即时启用组织服务接入配置
      description: |
        需要 organization:configure。SMTP 密码与 S3 凭据使用服务端密钥加密持久化；凭据字段留空时保留原值，
        只有对应 clear_* 为 true 时才清除。保存后新邀请、通知、上传和下载请求立即使用新配置，无需重启 API。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationSettingsRequest' }
      responses:
        '200':
          description: 已保存并生效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSettingsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/integrations/test:
    post:
      tags: [Admin]
      operationId: testAdminIntegration
      summary: 无副作用验证 SMTP 或存储连接
      description: |
        section=email 时验证网络、TLS 与 SMTP 身份认证但不发送邮件；section=storage 时验证本地目录或 S3 存储桶可访问，
        不创建存储桶、不上传也不删除对象。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section]
              properties:
                section: { type: string, enum: [email, storage] }
      responses:
        '200':
          description: 连接验证成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationTestResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
