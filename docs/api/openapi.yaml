openapi: 3.1.1
info:
  title: QUTCraft CMS API
  version: 0.1.0
  description: |
    公开门户与受认证后台共享的 API 契约。门户只读取已发布、可公开的数据；草稿、成员隐私、审核与 RCON 命令仅通过独立的管理前缀暴露。
    本文件是 Swagger UI 与 Apifox 的共同导入源；公开接口无认证，管理接口接受 Bearer JWT 或第一方网页的 HttpOnly Access Cookie，并继续执行 RBAC 授权。
  license:
    name: Proprietary
    url: https://github.com/QUTCraft/qutc-platform
servers:
  - url: https://api.qutcraft.local
    description: 示例部署地址；由 Apifox 环境或运行环境变量覆盖
security: []
tags:
  - name: Auth
    description: 注册、登录、令牌刷新与当前会话
  - name: Portal
    description: 公开门户内容与状态
  - name: Admin
    description: 受认证的后台管理能力
  - name: AI
    description: 受 RBAC、组织隔离、运行配额和人工确认约束的组织运营智能体
paths:
  /healthz:
    get:
      tags: [Auth]
      operationId: getHealth
      summary: 检查 API 服务存活状态
      security: []
      responses:
        '200':
          description: 服务正在运行
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '500':
          description: 服务健康检查失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 健康检查路径不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /readyz:
    get:
      tags: [Auth]
      operationId: getReadiness
      summary: 检查 API 及必要依赖是否可以接收流量
      description: 同时检查 MySQL 与 Redis；仅返回组件可用性，不返回连接地址、凭据或底层错误。
      security: []
      responses:
        '200':
          description: API 与必要依赖均可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '503':
          description: 至少一个必要依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
  /api/v1/portal/organizations/{organization_slug}:
    get:
      tags: [Portal]
      operationId: getPortalOrganization
      summary: 获取组织公开资料
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      responses:
        '200':
          description: 组织公开资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/configuration:
    get:
      tags: [Portal]
      operationId: getPortalRuntimeConfiguration
      summary: 获取当前公开门户运行时配置
      description: 无生效配置或生效 Manifest 已损坏时返回内置 MD3 Manifest；不会返回配置操作者、草稿或审计信息。
      security: []
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      responses:
        '200':
          description: 已校验的生效 Manifest 或安全默认值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalRuntimeConfigurationResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/content/{content_id}:
    get:
      tags: [Portal]
      operationId: getPortalContentDetail
      summary: 获取一篇已发布内容的完整正文
      description: 只返回当前组织中已发布的公开内容；草稿、下线内容和管理字段不会被公开。body 使用标准 Markdown，正文内由 CMS 上传的媒体会通过组织门户地址加载。
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 公开内容正文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalContentDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/portal/organizations/{organization_slug}/posts:
    get:
      tags: [Portal]
      operationId: listPortalPosts
      summary: 获取已发布的新闻、公告与活动
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema: { type: string, maxLength: 64 }
          description: 按公开分类筛选
      responses:
        '200':
          description: 已发布内容列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/projects:
    get:
      tags: [Portal]
      operationId: listPortalProjects
      summary: 获取公开项目
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '200':
          description: 公开项目列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/resources:
    get:
      tags: [Portal]
      operationId: listPortalResources
      summary: 获取可公开分发的资源
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
          description: 标题和描述的公开全文检索词
      responses:
        '200':
          description: 公开资源列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/knowledge/articles:
    get:
      tags: [Portal]
      operationId: listPortalKnowledgeArticles
      summary: 获取已发布的知识库文章
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema: { type: string, maxLength: 64 }
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 已发布知识文章列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticleListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/knowledge/directories:
    get:
      tags: [Portal]
      operationId: listPortalKnowledgeDirectories
      summary: 获取公开知识库目录
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 公开知识库目录及文章数量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDirectoryListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/portal/organizations/{organization_slug}/server-status:
    get:
      tags: [Portal]
      operationId: getPortalServerStatus
      summary: 获取服务器公开状态
      description: 只返回允许公开展示的状态；不会返回 RCON 连接、命令、TPS 原始监控或审核数据。当前服务器适配器仅绑定 QUTCraft 场景，其他组织返回 enabled=false 且不提供申请入口。
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      responses:
        '200':
          description: 服务器公开状态；未启用服务器适配器时 enabled 为 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/apply:
    post:
      tags: [Portal]
      operationId: submitPortalApplication
      summary: 提交公开加入申请
      description: 申请写入当前组织的后台审批队列；此接口不需要登录，不返回审批人、内部状态或服务器凭据。
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalApplicationRequest' }
      responses:
        '201':
          description: 申请已进入待审批队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalApplicationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerAuthUser
      summary: 注册用户并加入默认组织或接受邀请
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功；响应体返回短期访问令牌，刷新令牌通过 HttpOnly Cookie 下发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 邀请链接已过期或不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/invitations/{token}:
    get:
      tags: [Auth]
      operationId: getInvitation
      summary: 获取邀请链接公开信息
      description: 只返回组织名称、邀请邮箱、角色和有效期；token 只作为路径中的一次性凭据，不会在响应中回显。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: 邀请信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 邀请链接已过期、撤销或已使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/invitations/{token}/accept:
    post:
      tags: [Auth]
      operationId: acceptInvitation
      summary: 当前登录用户接受邀请
      description: 当前 Bearer JWT 的邮箱必须与邀请邮箱一致；接受时在事务中激活成员关系、授予邀请角色并将 token 标记为已使用。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: 邀请已接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAcceptanceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: 邀请链接已过期、撤销或已使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginAuthUser
      summary: 使用邮箱和密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功；响应体返回短期访问令牌，同时下发 Access、Refresh 与会话到期 Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuthSession
      summary: 使用 HttpOnly Cookie 轮换刷新令牌并获取新的访问令牌
      responses:
        '200':
          description: 新访问令牌；同时轮换 Access、Refresh 与会话到期 Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutAuthSession
      summary: 撤销 HttpOnly Cookie 中的刷新令牌
      responses:
        '200':
          description: 刷新令牌已撤销或不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthCurrentUser
      summary: 获取当前会话用户与当前组织角色
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      operationId: updateAuthCurrentUser
      summary: 更新当前用户资料
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: 用户资料已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/organizations:
    get:
      tags: [Auth]
      operationId: listAuthOrganizations
      summary: 获取当前账户可切换的组织
      description: 只返回当前用户具有 active 成员关系的组织，以及该用户在各组织内独立计算的角色；current 标识访问令牌当前绑定的组织。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 可用组织列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMembershipListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/switch-organization:
    post:
      tags: [Auth]
      operationId: switchAuthOrganization
      summary: 切换当前会话的组织上下文
      description: 要求 Access Cookie（或 Bearer JWT）与同一用户的 HttpOnly Refresh Cookie。服务端验证目标组织成员关系，撤销旧刷新令牌，并为目标组织重新签发会话 Cookie；后续刷新会保持该组织上下文。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchOrganizationRequest' }
      responses:
        '200':
          description: 已切换组织；响应体携带新访问令牌，刷新令牌通过 HttpOnly Cookie 轮换
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/membership/history:
    get:
      tags: [Auth]
      operationId: listMembershipHistory
      summary: 获取当前用户成员关系变更记录
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成员关系历史
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipEventListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/membership/leave:
    post:
      tags: [Auth]
      operationId: leaveMembership
      summary: 当前用户退出组织
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200': { description: 已退出组织 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/session:
    get:
      tags: [Admin]
      operationId: getAdminSession
      summary: 验证后台会话与组织读取权限
      description: 基础设施探针路由；用于验证 Bearer JWT、成员关系与 `organization:read` RBAC 权限，不返回业务工作台数据。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前后台会话用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: 获取后台概览
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前管理员可见的聚合数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/content:
    get:
      tags: [Admin]
      operationId: listAdminContent
      summary: 获取内容工作区条目
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 管理范围内的内容（含草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdminContent
      summary: 创建内容草稿
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminContentRequest' }
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/knowledge/directories:
    get:
      tags: [Admin]
      operationId: listAdminKnowledgeDirectories
      summary: 获取知识库目录
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 知识库目录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKnowledgeDirectoryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdminKnowledgeDirectory
      summary: 创建知识库目录
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDirectoryWriteRequest' }
      responses:
        '201':
          description: 知识库目录已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKnowledgeDirectoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/knowledge/directories/{directory_id}:
    patch:
      tags: [Admin]
      operationId: updateAdminKnowledgeDirectory
      summary: 更新知识库目录
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: directory_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDirectoryWriteRequest' }
      responses:
        '200':
          description: 知识库目录已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKnowledgeDirectoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}:
    get:
      tags: [Admin]
      operationId: getAdminContent
      summary: 获取单条后台内容
      description: 按内容 ID 返回当前组织范围内的完整正文，用于独立内容编辑页，不受列表分页影响。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 内容详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: updateAdminContent
      summary: 更新内容草稿
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminContentRequest' }
      responses:
        '200':
          description: 草稿已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}/publish:
    post:
      tags: [Admin]
      operationId: publishAdminContent
      summary: 发布内容
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 内容已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}/archive:
    post:
      tags: [Admin]
      operationId: archiveAdminContent
      summary: 下线内容
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 内容已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/assets:
    get:
      tags: [Admin]
      operationId: listAdminAssets
      summary: 获取媒体资源列表
      description: 返回当前组织的媒体资源元数据；不会返回 MinIO/S3 存储密钥或对象存储直链。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: query
          in: query
          description: 按原始文件名搜索
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 媒体资源列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAssetListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: uploadAdminAsset
      summary: 上传媒体资源
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: '仅允许 PNG、JPEG、WebP、PDF、ZIP、MP4；单文件不超过 10 MiB。' }
                content_id: { type: string, minLength: 1, maxLength: 64, description: '可选；存在时关联同组织的 news、resource 或 knowledge 内容。内容发布后，引用的图片与附件可通过门户地址公开读取。' }
      responses:
        '201':
          description: 资产已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/assets/{asset_id}/download:
    get:
      tags: [Admin]
      operationId: downloadAdminAsset
      summary: 下载管理端媒体资源
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: 文件流 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/assets/{asset_id}/publish:
    post:
      tags: [Admin]
      operationId: publishAdminAssetAsResource
      summary: 将未关联文件归档为公开资源
      description: 文件上传后默认保持私有。本操作在同一事务中创建并发布 resource 内容、关联文件并写入修订与审计；成功后文件会出现在门户资源中心。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishAssetResourceRequest' }
      responses:
        '201':
          description: 文件已归档并公开发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/assets/{asset_id}:
    delete:
      tags: [Admin]
      operationId: deleteAdminAsset
      summary: 永久删除媒体资源
      description: 删除资产元数据和存储对象。公开文件必须先下架；草稿、待审核或已下线内容可保留编辑记录并删除其文件。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 媒体资源已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/assets/{asset_id}/stats:
    get:
      tags: [Admin]
      operationId: getAdminAssetDownloadStats
      summary: 获取媒体资源下载统计
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 当前组织范围内的下载次数和最近下载时间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDownloadStatsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/portal/organizations/{organization_slug}/assets/{asset_id}/download:
    get:
      tags: [Portal]
      operationId: downloadPortalAsset
      summary: 获取已公开媒体资源
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: 文件流；图片媒体以内联方式返回，其余类型作为附件下载 }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: 获取组织成员与角色
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{user_id}:
    patch:
      tags: [Admin]
      operationId: updateAdminUser
      summary: 更新组织成员状态与角色
      description: |
        只修改当前组织的成员关系，不修改用户的全局账户状态。可写状态仅为 active 或 disabled；
        invited 只由邀请流程产生。停用会撤销该用户现有 Refresh Token，旧 Access Token 在下一次请求时因成员关系校验返回 401。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUserRequest' }
      responses:
        '200':
          description: 成员已更新并记录审计事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/invitations:
    get:
      tags: [Admin]
      operationId: listAdminInvitations
      summary: 获取当前组织的成员邀请
      description: 仅返回邀请元数据和邮件投递状态，不返回或恢复任何明文邀请 token；可按邀请状态筛选。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: 当前组织的邀请列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitationListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdminInvitation
      summary: 创建成员邀请
      description: 同一组织同一邮箱只能有一个待处理邀请；邀请只允许授予 member、editor 或 administrator，不能授予 owner。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: 邀请已创建；invite_url 中包含仅返回一次的明文 token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInvitationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}/revisions:
    get:
      tags: [Admin]
      operationId: listAdminContentRevisions
      summary: 获取内容修订历史
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 当前组织范围内的内容修订快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevisionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/content/{content_id}/revisions/{revision_id}:
    get:
      tags: [Admin]
      operationId: getAdminContentRevision
      summary: 获取内容修订详情
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: revision_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 含 Markdown 正文的修订快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRevisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/content/{content_id}/revisions/{revision_id}/restore:
    post:
      tags: [Admin]
      operationId: restoreAdminContentRevision
      summary: 将内容修订恢复为新草稿
      description: 恢复操作不会直接发布内容，而是将当前内容写成新的 draft 修订。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: revision_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 已恢复为草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/invitations/{invitation_id}:
    delete:
      tags: [Admin]
      operationId: revokeAdminInvitation
      summary: 撤销待处理的成员邀请
      description: 仅可撤销当前组织中仍为 pending 的邀请。撤销后原 token 立即失效，邀请记录与审计记录保留。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 邀请已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/invitation-batches:
    post:
      tags: [Admin]
      operationId: createAdminInvitationBatch
      summary: 批量创建成员邀请
      description: |
        一次提交 1 至 20 条邀请，每条记录独立创建、投递和审计；单条校验、重复或成员冲突不会回滚其他成功项。
        响应保持请求顺序并逐项返回成功结果或稳定错误码。成功项的 invite_url 仍然只在本次响应中展示。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationBatchRequest' }
      responses:
        '200':
          description: 批量处理完成；具体成功和失败数量见响应数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInvitationBatchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/invitations/{invitation_id}/email/retry:
    post:
      tags: [Admin]
      operationId: retryAdminInvitationEmail
      summary: 轮换邀请链接并重试邮件
      description: |
        仅可对当前组织仍为 pending 的邀请执行。服务端先生成新 token 并替换 token 哈希，使旧链接立即失效，
        再在业务事务外尝试 SMTP 投递。邮件失败不会撤销邀请，响应仍返回本次唯一可见的新 invite_url 与真实投递状态。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 邀请链接已轮换，邮件投递已尝试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInvitationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/audit:
    get:
      tags: [Admin]
      operationId: listAdminAuditEvents
      summary: 查询当前组织的审计记录
      description: 需要 `audit:read`；服务端始终以当前会话 organization_id 过滤，客户端不能指定或覆盖组织范围。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: action
          in: query
          schema: { type: string, maxLength: 96 }
        - name: target_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: result
          in: query
          schema: { type: string, maxLength: 24 }
        - name: actor_user_id
          in: query
          schema: { type: string, maxLength: 36 }
        - name: request_id
          in: query
          schema: { type: string, maxLength: 64 }
        - name: date_from
          in: query
          description: 按 UTC 自然日筛选，包含该日。
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: 按 UTC 自然日筛选，包含该日，且不能早于 date_from。
          schema: { type: string, format: date }
      responses:
        '200':
          description: 当前组织内按时间倒序排列的审计记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 邮件适配器未启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410':
          description: 邀请已过期、撤销或接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/ai/config:
    get:
      tags: [AI]
      operationId: getAdminAIConfiguration
      summary: 获取当前组织的智能体运行策略与模型供应商状态
      description: 需要 `ai:use`。组织尚未保存配置时返回服务端默认策略；响应可以返回非敏感的上游根地址、模型名和密钥脱敏提示，但永远不会返回 API Key 原文或环境变量内容。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前组织策略与脱敏后的模型供应商状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConfigurationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [AI]
      operationId: updateAdminAIConfiguration
      summary: 更新当前组织的智能体运行策略
      description: 需要 `organization:configure`。配置按组织持久化并立即应用于后续新建运行；关闭功能不会删除历史运行、引用或审计。组织所有者可以提交 OpenAI 兼容接口地址、模型名和 API Key，Key 在服务端加密保存且不会回显。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
