        '200':
          description: 当前组织人工质量汇总；无评分时计数和均分为 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanEvaluationSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/ai/activity-plans/{plan_id}:
    get:
      tags: [AI]
      operationId: getAdminAIActivityPlan
      summary: 查询活动策划、固定引用和建议操作
      description: 需要 `ai:use`，且只能读取当前组织的数据。状态会随底层智能体运行同步为 generating、ready、failed 或 canceled。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 36 }
      responses:
        '200':
          description: 活动策划详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPlanResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/ai/activity-plans/{plan_id}/evaluation:
    get:
      tags: [AI]
      operationId: getAdminAIActivityPlanEvaluation
      summary: 获取当前用户对活动方案的人工评分
      description: 需要 `ai:use`。评分按当前组织、方案和当前用户隔离；尚未评分时 data 为 null。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
