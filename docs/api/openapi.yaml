        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      operationId: updateAdminInvitationTemplate
      summary: 更新组织邀请邮件模板
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
