        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 按审批状态筛选。
          schema: { type: string, enum: [pending, approved, rejected] }
        - name: type
          in: query
          description: 按申请类型筛选。
          schema: { type: string, enum: [whitelist, membership] }
        - name: server_sync_status
          in: query
          description: 按服务器同步状态筛选；none 表示没有同步任务。
          schema: { type: string, enum: [none, pending, succeeded, failed] }
        - name: query
          in: query
          description: 在申请人姓名、游戏 ID、邮箱和 QQ 中进行模糊搜索。
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminApplicationListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/applications/{application_id}/approve:
