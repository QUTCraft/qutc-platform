openapi: 3.1.1
info:
  title: QUTCraft CMS API
  version: 0.1.0
  description: |
    公开门户与受认证后台共享的 API 契约。门户只读取已发布、可公开的数据；草稿、成员隐私、审核与 RCON 命令仅通过独立的管理前缀暴露。
    本文件是 Swagger UI 与 Apifox 的共同导入源；公开接口无认证，管理接口要求 Bearer JWT 与 RBAC 授权。
  license:
    name: Proprietary
    url: https://github.com/QUTCraft/qutc-platform
servers:
  - url: https://api.qutcraft.local
    description: 示例部署地址；由 Apifox 环境或运行环境变量覆盖
security: []
tags:
  - name: Auth
    description: 注册、登录、令牌刷新与当前会话
  - name: Portal
    description: 公开门户内容与状态
  - name: Admin
    description: 受认证的后台管理能力
paths:
  /healthz:
    get:
      tags: [Auth]
      operationId: getHealth
      summary: 检查 API 服务存活状态
      security: []
      responses:
        '200':
          description: 服务正在运行
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '500':
          description: 服务健康检查失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 健康检查路径不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/portal/organizations/{organization_slug}:
    get:
      tags: [Portal]
      operationId: getPortalOrganization
      summary: 获取组织公开资料
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      responses:
        '200':
          description: 组织公开资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/content/{content_id}:
    get:
      tags: [Portal]
      operationId: getPortalContentDetail
      summary: 获取一篇已发布内容的完整正文
      description: 只返回当前组织中已发布的公开内容；草稿、下线内容和管理字段不会被公开。
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 公开内容正文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalContentDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/portal/organizations/{organization_slug}/posts:
    get:
      tags: [Portal]
      operationId: listPortalPosts
      summary: 获取已发布的新闻、公告与活动
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema: { type: string, maxLength: 64 }
          description: 按公开分类筛选
      responses:
        '200':
          description: 已发布内容列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/projects:
    get:
      tags: [Portal]
      operationId: listPortalProjects
      summary: 获取公开项目
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '200':
          description: 公开项目列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/resources:
    get:
      tags: [Portal]
      operationId: listPortalResources
      summary: 获取可公开分发的资源
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
          description: 标题和描述的公开全文检索词
      responses:
        '200':
          description: 公开资源列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/knowledge/articles:
    get:
      tags: [Portal]
      operationId: listPortalKnowledgeArticles
      summary: 获取已发布的知识库文章
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema: { type: string, maxLength: 64 }
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 已发布知识文章列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticleListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/knowledge/directories:
    get:
      tags: [Portal]
      operationId: listPortalKnowledgeDirectories
      summary: 获取公开知识库目录
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 公开知识库目录及文章数量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDirectoryListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/portal/organizations/{organization_slug}/server-status:
    get:
      tags: [Portal]
      operationId: getPortalServerStatus
      summary: 获取服务器公开状态
      description: 只返回允许公开展示的状态；不会返回 RCON 连接、命令、TPS 原始监控或审核数据。
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      responses:
        '200':
          description: 服务器公开状态；未启用服务器适配器时 enabled 为 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portal/organizations/{organization_slug}/apply:
    post:
      tags: [Portal]
      operationId: submitPortalApplication
      summary: 提交公开加入申请
      description: 申请写入当前组织的后台审批队列；此接口不需要登录，不返回审批人、内部状态或服务器凭据。
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalApplicationRequest' }
      responses:
        '201':
          description: 申请已进入待审批队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalApplicationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerAuthUser
      summary: 注册用户并加入默认组织或接受邀请
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功，返回访问与刷新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 邀请链接已过期或不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invitations/{token}:
    get:
      tags: [Auth]
      operationId: getInvitation
      summary: 获取邀请链接公开信息
      description: 只返回组织名称、邀请邮箱、角色和有效期；token 只作为路径中的一次性凭据，不会在响应中回显。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: 邀请信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 邀请链接已过期、撤销或已使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/invitations/{token}/accept:
    post:
      tags: [Auth]
      operationId: acceptInvitation
      summary: 当前登录用户接受邀请
      description: 当前 Bearer JWT 的邮箱必须与邀请邮箱一致；接受时在事务中激活成员关系、授予邀请角色并将 token 标记为已使用。
      security: [{ BearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: 邀请已接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAcceptanceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: 邀请链接已过期、撤销或已使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginAuthUser
      summary: 使用邮箱和密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功，返回访问与刷新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuthSession
      summary: 轮换刷新令牌并获取新的令牌对
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 新令牌对
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutAuthSession
      summary: 撤销刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: 刷新令牌已撤销或不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthCurrentUser
      summary: 获取当前会话用户与当前组织角色
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      operationId: updateAuthCurrentUser
      summary: 更新当前用户资料
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: 用户资料已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/membership/history:
    get:
      tags: [Auth]
      operationId: listMembershipHistory
      summary: 获取当前用户成员关系变更记录
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成员关系历史
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipEventListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/membership/leave:
    post:
      tags: [Auth]
      operationId: leaveMembership
      summary: 当前用户退出组织
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 已退出组织 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/session:
    get:
      tags: [Admin]
      operationId: getAdminSession
      summary: 验证后台会话与组织读取权限
      description: 基础设施探针路由；用于验证 Bearer JWT、成员关系与 `organization:read` RBAC 权限，不返回业务工作台数据。
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 当前后台会话用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: 获取后台概览
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 当前管理员可见的聚合数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/content:
    get:
      tags: [Admin]
      operationId: listAdminContent
      summary: 获取内容工作区条目
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 管理范围内的内容（含草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdminContent
      summary: 创建内容草稿
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminContentRequest' }
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/knowledge/directories:
    get:
      tags: [Admin]
      operationId: listAdminKnowledgeDirectories
      summary: 获取知识库目录
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 知识库目录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKnowledgeDirectoryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdminKnowledgeDirectory
      summary: 创建知识库目录
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDirectoryWriteRequest' }
      responses:
        '201':
          description: 知识库目录已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKnowledgeDirectoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/knowledge/directories/{directory_id}:
    patch:
      tags: [Admin]
      operationId: updateAdminKnowledgeDirectory
      summary: 更新知识库目录
      security: [{ BearerAuth: [] }]
      parameters:
        - name: directory_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDirectoryWriteRequest' }
      responses:
        '200':
          description: 知识库目录已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKnowledgeDirectoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}:
    patch:
      tags: [Admin]
      operationId: updateAdminContent
      summary: 更新内容草稿
      security: [{ BearerAuth: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminContentRequest' }
      responses:
        '200':
          description: 草稿已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}/publish:
    post:
      tags: [Admin]
      operationId: publishAdminContent
      summary: 发布内容
      security: [{ BearerAuth: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 内容已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/content/{content_id}/archive:
    post:
      tags: [Admin]
      operationId: archiveAdminContent
      summary: 下线内容
      security: [{ BearerAuth: [] }]
      parameters:
        - name: content_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 内容已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/assets:
    post:
      tags: [Admin]
      operationId: uploadAdminAsset
      summary: 上传媒体资源
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                content_id: { type: string }
      responses:
        '201':
          description: 资产已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/assets/{asset_id}/download:
    get:
      tags: [Admin]
      operationId: downloadAdminAsset
      summary: 下载管理端媒体资源
      security: [{ BearerAuth: [] }]
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: 文件流 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/portal/organizations/{organization_slug}/assets/{asset_id}/download:
    get:
      tags: [Portal]
      operationId: downloadPortalAsset
      summary: 下载已公开媒体资源
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
        - name: asset_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: 文件流 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: 获取组织成员与角色
      security: [{ BearerAuth: [] }]
