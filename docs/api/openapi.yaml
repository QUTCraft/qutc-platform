        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/applications/{application_id}/server-sync/retry:
    post:
      tags: [Admin]
      operationId: retryAdminApplicationServerSync
      summary: 重试失败的服务器同步
      description: 仅允许重试已批准白名单申请的最新 failed 同步记录；并发重试、pending 或 succeeded 状态返回 409。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: 重试已执行，响应返回最新同步结果；外部适配仍失败时 data.status 为 failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationServerSyncResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/portal/config:
