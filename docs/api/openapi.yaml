          application/json:
            schema: { $ref: '#/components/schemas/InvitationTemplateRequest' }
      responses:
        '200':
          description: 邀请模板已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/notifications/outbox:
    get:
      tags: [Admin]
      operationId: listAdminNotificationOutbox
      summary: 获取异步通知队列
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, enum: [pending, sending, sent, failed, disabled] }
      responses:
        '200':
