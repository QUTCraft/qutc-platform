      description: 需要 `ai:use`。响应只暴露驱动模式与模型标识，不返回模型 API Key、上游地址或其他服务端凭据。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 可用智能体与当前模型供应商状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIAgentCatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/ai/knowledge/search:
    post:
      tags: [AI]
      operationId: searchAdminAIKnowledge
      summary: 在当前组织的授权知识范围内检索引用资料
      description: 需要 `ai:use` 与 `knowledge:read`。服务端先按当前 organization_id 和 knowledge 类型过滤，再返回最少必要的标题、摘要、状态与版本时间。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIKnowledgeSearchRequest' }
      responses:
        '200':
          description: 当前组织内匹配的知识资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIKnowledgeSearchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/ai/runs:
    post:
      tags: [AI]
      operationId: createAdminAIRun
      summary: 创建一次异步智能体生成运行
      description: |
        需要 `ai:use` 与 `knowledge:read`。content-copilot 与 activity-planner 只能读取显式选择、属于当前组织的 knowledge 内容，
        并生成带引用的 Markdown 提案。接口不会自行创建项目或发布 CMS 内容；创建成功后通过查询接口获取终态。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIRunCreateRequest' }
      responses:
        '202':
          description: 运行已排队；开发 Mock 与真实模型会通过 mode 字段明确区分
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIRunResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前组织已停用智能体功能
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/ai/runs/{run_id}:
    get:
      tags: [AI]
      operationId: getAdminAIRun
      summary: 查询当前组织内的智能体运行
      description: 返回运行状态、生成结果、模型标识、Token 用量与固定引用快照；不返回隐藏推理过程。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 36 }
      responses:
        '200':
          description: 智能体运行及其引用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIRunResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/ai/runs/{run_id}/cancel:
    post:
      tags: [AI]
      operationId: cancelAdminAIRun
      summary: 取消尚未结束的智能体运行
      description: 只允许取消 queued 或 running 状态；已成功、失败或取消的运行返回 409。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
