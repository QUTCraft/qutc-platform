      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前组织的门户配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalConfigurationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      operationId: saveAdminPortalDraft
      summary: 校验并保存门户草稿
      description: 保存草稿不会改变 active_manifest，也不会影响当前公开门户；成功写入 portal.config_update 审计事件。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalConfigurationRequest' }
      responses:
        '200':
          description: 草稿已持久化
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalConfigurationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/notifications/invitation-template:
