      operationId: executeRestrictedServerCommand
      summary: 执行受限 RCON 命令
      description: 仅允许服务端白名单中定义的命令；服务端必须记录操作者、命令、结果与 request_id。
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerCommandRequest' }
      responses:
        '200':
          description: 命令已受理或执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerCommandResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 后台访问令牌；服务端必须基于组织成员身份与 RBAC 进行二次授权。
  parameters:
    OrganizationSlug:
      name: organization_slug
      in: path
      required: true
      description: 组织公开标识，仅允许小写字母、数字和连字符。
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        example: qutcraft
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    NotFound:
      description: 当前组织不存在或没有公开门户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 缺少、失效或无法验证的访问令牌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 当前角色没有执行此管理操作的权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: 请求数据未通过校验
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源状态已发生变化，无法重复执行操作
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, example: req_01J0QUTC9B7ABCD }
    ListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [page, page_size, total]
          properties:
            page: { type: integer, minimum: 1, example: 1 }
            page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
            total: { type: integer, minimum: 0, example: 3 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: portal.organization_not_found }
            message: { type: string, example: 未找到可公开展示的组织。 }
            details: { type: object, additionalProperties: true }
            request_id: { type: string, example: req_01J0QUTC9B7ABCD }
    Organization:
      type: object
      required: [id, slug, name, short_name, tagline, introduction, contact_email, social_links]
      properties:
        id: { type: string, example: org_qutcraft }
        slug: { type: string, example: qutcraft }
        name: { type: string, example: QUTCraft Commons }
        short_name: { type: string, example: QUTCraft }
        tagline: { type: string, example: 把社团正在发生的事，认真地呈现出来。 }
        introduction: { type: string }
        contact_email: { type: string, format: email }
        social_links:
          type: array
          items:
            type: object
            required: [label, href]
            properties:
              label: { type: string }
              href: { type: string, format: uri-reference }
    Post:
      type: object
      required: [id, title, excerpt, category, published_at, reading_minutes]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        excerpt: { type: string, maxLength: 500 }
        cover_url: { type: [string, 'null'], format: uri }
        category: { type: string, maxLength: 64 }
        published_at: { type: string, format: date-time }
        reading_minutes: { type: integer, minimum: 1 }
    PortalContentType:
      type: string
      enum: [news, resource, knowledge]
    PortalContentAsset:
      type: object
      required: [id, original_name, mime_type, size_bytes]
      properties:
        id: { type: string }
        original_name: { type: string, maxLength: 255 }
        mime_type: { type: string, maxLength: 120 }
        size_bytes: { type: integer, format: int64, minimum: 0 }
    PortalContentDetail:
      type: object
      required: [id, title, type, category, excerpt, body, published_at, updated_at, reading_minutes]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        type: { $ref: '#/components/schemas/PortalContentType' }
        category: { type: string, maxLength: 64 }
        excerpt: { type: string, maxLength: 500 }
        body: { type: string }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        reading_minutes: { type: integer, minimum: 1 }
        asset:
          anyOf:
            - $ref: '#/components/schemas/PortalContentAsset'
            - type: 'null'
        download_url: { type: [string, 'null'], format: uri-reference }
    ProjectStatus:
      type: string
      enum: [active, research, completed]
    Project:
      type: object
      required: [id, title, summary, status, tags, updated_at]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        summary: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        tags: { type: array, maxItems: 8, items: { type: string, maxLength: 32 } }
        updated_at: { type: string, format: date-time }
        public_url: { type: [string, 'null'], format: uri-reference }
    ResourceKind:
      type: string
      enum: [document, template, package, video]
    Resource:
      type: object
      required: [id, title, description, kind, size_bytes, updated_at, download_url]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 500 }
        kind: { $ref: '#/components/schemas/ResourceKind' }
        size_bytes: { type: integer, minimum: 0, format: int64 }
        updated_at: { type: string, format: date-time }
        download_url:
          type: [string, 'null']
          format: uri-reference
          description: 有关联文件时返回受控下载地址；没有文件时为 null，前端不得自行拼接对象存储 URL。
    KnowledgeArticle:
      type: object
      required: [id, title, summary, category, updated_at, reading_minutes]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        summary: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 64 }
        updated_at: { type: string, format: date-time }
        reading_minutes: { type: integer, minimum: 1 }
    KnowledgeDirectory:
      type: object
      required: [id, name, slug, description, article_count, updated_at]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        article_count: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    ServerStatus:
      type: object
      required: [enabled, label, state, updated_at]
      properties:
        enabled: { type: boolean }
        label: { type: string, maxLength: 100 }
        state: { type: string, enum: [online, maintenance, offline] }
        version: { type: [string, 'null'] }
        online_players: { type: [integer, 'null'], minimum: 0 }
        max_players: { type: [integer, 'null'], minimum: 1 }
        updated_at: { type: string, format: date-time }
        apply_url: { type: [string, 'null'], format: uri-reference }
    OrganizationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Organization' }
        meta: { $ref: '#/components/schemas/Meta' }
    PortalContentDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PortalContentDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
    PostListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ProjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ResourceListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    KnowledgeArticleListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/KnowledgeArticle' } }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ServerStatusResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ServerStatus' }
        meta: { $ref: '#/components/schemas/Meta' }
    PortalApplicationRequest:
      type: object
      required: [class_name, name, game_id, qq_number, email]
      properties:
