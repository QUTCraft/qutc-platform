          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 通知已重新排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationOutboxResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/organization:
    get:
      tags: [Admin]
      operationId: getAdminOrganizationProfile
      summary: 读取当前组织公开资料
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 当前组织公开资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      operationId: updateAdminOrganizationProfile
      summary: 更新当前组织公开资料
      description: 需要 organization:configure；保存后立即影响 Portal，并写入 organization.profile_update 审计。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationProfileRequest' }
      responses:
        '200':
          description: 组织资料已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/portal/config/enable:
    post:
      tags: [Admin]
      operationId: enableAdminPortalConfiguration
      summary: 启用已保存的门户草稿
      description: 在事务内重新校验草稿并复制为 active_manifest；成功写入 portal.config_enable 审计事件。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 草稿已成为生效配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalConfigurationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/portal/config/restore-default:
    post:
      tags: [Admin]
      operationId: restoreDefaultAdminPortalConfiguration
      summary: 原子恢复默认 MD3 门户
      description: 在单个数据库事务中将内置 MD3 Manifest 同时写为草稿和生效版本，并写入 portal.config_restore_default 审计事件。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 默认 MD3 已成为草稿和生效配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalConfigurationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/server/status:
    get:
      tags: [Admin]
      operationId: getAdminServerStatus
      summary: 获取服务器适配器状态
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      responses:
        '200':
          description: 包含仅限后台可见的适配器状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminServerStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/server/commands:
    post:
      tags: [Admin]
      operationId: executeRestrictedServerCommand
      summary: 执行受限 RCON 命令
      description: 仅允许服务端白名单中定义的命令；服务端必须记录操作者、命令、结果与 request_id。
      security: [{ BearerAuth: [] }, { AccessCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerCommandRequest' }
      responses:
        '200':
          description: 命令已受理或执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerCommandResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: 服务器适配器不可用或执行失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 后台访问令牌；服务端必须基于组织成员身份与 RBAC 进行二次授权。
    AccessCookie:
      type: apiKey
      in: cookie
      name: qutc_access
      description: 第一方网页使用的短期 HttpOnly Access Cookie；与 Bearer JWT 使用相同的签名、组织隔离和 RBAC 校验。
  parameters:
    OrganizationSlug:
      name: organization_slug
      in: path
      required: true
      description: 组织公开标识，仅允许小写字母、数字和连字符。
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        example: qutcraft
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    NotFound:
      description: 当前组织不存在或没有公开门户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 缺少、失效、无法验证的访问令牌，或当前账户/组织成员关系已停用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 当前角色没有执行此管理操作的权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: 请求数据未通过校验
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源状态已发生变化，无法重复执行操作
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: 上传请求体超过服务端限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 当前客户端对该接口的请求超过限额
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: 当前窗口允许的最大请求数
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Remaining:
          description: 当前窗口剩余请求数
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Reset:
          description: 当前窗口结束的 Unix 时间戳
          schema: { type: integer, format: int64 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: 当前配置的外部依赖或存储后端暂时不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, example: req_01J0QUTC9B7ABCD }
    ListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [page, page_size, total]
          properties:
            page: { type: integer, minimum: 1, example: 1 }
            page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
            total: { type: integer, minimum: 0, example: 3 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: portal.organization_not_found }
            message: { type: string, example: 未找到可公开展示的组织。 }
            details:
              oneOf:
                - { type: object, additionalProperties: true }
                - { type: array, items: { type: object, additionalProperties: true } }
            request_id: { type: string, example: req_01J0QUTC9B7ABCD }
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        checks:
          type: object
          required: [mysql, redis]
          properties:
            mysql: { type: string, enum: [ok, unavailable] }
            redis: { type: string, enum: [ok, unavailable] }
    Organization:
      type: object
      required: [id, slug, name, short_name, tagline, introduction, contact_email, social_links, is_public, updated_at]
      properties:
        id: { type: string, example: org_qutcraft }
        slug: { type: string, example: qutcraft }
        name: { type: string, example: QUTCraft Commons }
        short_name: { type: string, example: QUTCraft }
        tagline: { type: string, example: 把社团正在发生的事，认真地呈现出来。 }
        introduction: { type: string }
        contact_email:
          oneOf:
            - { type: string, format: email }
            - { type: string, const: '' }
        social_links:
          type: array
          items:
            type: object
            required: [label, href]
            properties:
              label: { type: string }
              href: { type: string, format: uri-reference }
        is_public: { type: boolean }
        updated_at: { type: string, format: date-time }
    OrganizationProfileRequest:
      type: object
      required: [name, short_name, tagline, introduction, contact_email, social_links, is_public]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        short_name: { type: string, minLength: 1, maxLength: 40 }
        tagline: { type: string, maxLength: 160 }
        introduction: { type: string, maxLength: 2000 }
        contact_email:
          oneOf:
            - { type: string, format: email, maxLength: 254 }
            - { type: string, const: '' }
        social_links:
          type: array
          maxItems: 12
          items:
            type: object
            required: [label, href]
            properties:
              label: { type: string, minLength: 1, maxLength: 40 }
              href: { type: string, format: uri }
        is_public: { type: boolean }
    Post:
      type: object
      required: [id, title, excerpt, category, published_at, reading_minutes]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        excerpt: { type: string, maxLength: 500 }
        cover_url: { type: [string, 'null'], format: uri }
        category: { type: string, maxLength: 64 }
        published_at: { type: string, format: date-time }
        reading_minutes: { type: integer, minimum: 1 }
    PortalContentType:
      type: string
      enum: [news, resource, knowledge]
    PortalContentAsset:
      type: object
      required: [id, original_name, mime_type, size_bytes]
      properties:
        id: { type: string }
        original_name: { type: string, maxLength: 255 }
        mime_type: { type: string, maxLength: 120 }
        size_bytes: { type: integer, format: int64, minimum: 0 }
    PortalContentDetail:
      type: object
      required: [id, title, type, category, excerpt, body, published_at, updated_at, reading_minutes]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        type: { $ref: '#/components/schemas/PortalContentType' }
        category: { type: string, maxLength: 64 }
        excerpt: { type: string, maxLength: 500 }
        body: { type: string, description: '标准 Markdown 正文；正文中的 CMS 媒体会以 /api/v1/portal/organizations/{organization_slug}/assets/{asset_id}/download 公开地址返回。' }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        reading_minutes: { type: integer, minimum: 1 }
        asset:
          anyOf:
            - $ref: '#/components/schemas/PortalContentAsset'
            - type: 'null'
        download_url: { type: [string, 'null'], format: uri-reference }
    ProjectStatus:
      type: string
      enum: [active, research, completed]
    Project:
