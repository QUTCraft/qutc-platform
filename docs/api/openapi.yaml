          type: string
          description: custom 模式必填的同源 .json 路径；md3 模式不得提供。
          example: /portals/campus-club/theme.json
    PortalManifest:
      type: object
      required: [schema, id, version, display_name, entry, theme, capabilities, fallback]
      properties:
        schema: { type: string, const: qutc.portal/v1 }
        id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64 }
        version: { type: string, example: 0.1.0 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        entry:
          type: string
          description: 以单个 / 开头、无查询参数或片段的同源 .html 静态入口。
          example: /index.html
        theme: { $ref: '#/components/schemas/PortalThemeReference' }
        capabilities:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [organization.read, public_content.read, projects.read, assets.read, knowledge.read, server.status.read]
        fallback: { type: string, const: md3 }
        integrity:
          type: string
          description: 可选的 sha256、sha384 或 sha512 SRI。
