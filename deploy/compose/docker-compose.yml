name: qutcraft-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qutcraft}
      MYSQL_USER: ${MYSQL_USER:-qutcraft}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qutcraft}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
      MYSQL_DSN: ${MYSQL_USER:-qutcraft}:${MYSQL_PASSWORD:-qutcraft}@tcp(mysql:3306)/${MYSQL_DATABASE:-qutcraft}?charset=utf8mb4&parseTime=True&loc=UTC
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: remote
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ../../docs/api/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"

volumes:
  mysql_data:
  redis_data:
  minio_data:
