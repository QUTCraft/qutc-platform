name: qutcraft-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qutcraft}
      MYSQL_USER: ${MYSQL_USER:-qutcraft}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qutcraft}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /tmp/qutcraft-uploads && chown -R 65532:65532 /tmp/qutcraft-uploads && chmod 0750 /tmp/qutcraft-uploads"]
    volumes:
      - media_data:/tmp/qutcraft-uploads
    restart: "no"

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
      REDIS_ADDR: redis:6379
      MYSQL_DSN: ${MYSQL_USER:-qutcraft}:${MYSQL_PASSWORD:-qutcraft}@tcp(mysql:3306)/${MYSQL_DATABASE:-qutcraft}?charset=utf8mb4&parseTime=True&loc=UTC
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8082,http://127.0.0.1:8082,http://localhost,http://127.0.0.1}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/tmp/qutcraft-uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-qutcraft-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:8082}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-QUTCraft Commons}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-8s}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mock-content-v1}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30s}
      AI_RUN_LIMIT_PER_HOUR: ${AI_RUN_LIMIT_PER_HOUR:-20}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - media_data:/tmp/qutcraft-uploads
    healthcheck:
      test: ["CMD", "/qutcraft-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: remote
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:80"
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ../../docs/api/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  media_data:
